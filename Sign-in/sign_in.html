<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in/Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="modal modal-sheet position-static d-block bg-body-secondary p-4 py-md-5"
     tabindex="-1"
     role="dialog"
     id="modalSignin">

    <div class="modal-dialog">

        <div class="modal-content rounded-4 shadow">

            <div class="modal-header p-5 pb-4 border-bottom-0">

                <h1 class="fw-bold mb-0 fs-2">
                    Sign up for free
                </h1>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                </button>

            </div>

            <div class="modal-body p-5 pt-0">

                <form class="">

                    <div class="form-floating mb-3">

                        <input type="email"
                               class="form-control rounded-3"
                               id="floatingInput"
                               placeholder="name@example.com">

                        <label for="floatingInput">
                            Email address
                        </label>

                    </div>

                    <div class="form-floating mb-3">

                        <input type="password"
                               class="form-control rounded-3"
                               id="floatingPassword"
                               placeholder="Password">

                        <label for="floatingPassword">
                            Password
                        </label>

                    </div>

                    <a href="/dashboard/main.html" class="w-100 mb-2 btn btn-lg rounded-3 btn-primary"
                            type="submit">
                        Sign up
                </a>

                    <small class="text-body-secondary">
                        By clicking Sign up, you agree to the terms of use.
                    </small>

                    <hr class="my-4">

                    <h2 class="fs-5 fw-bold mb-3">
                        Already a User? Log in
                    </h2>

                    <a href="log_in.html" class="w-100 py-2 mb-2 btn btn-outline-secondary rounded-3"
                            type="submit">

                        <svg class="bi me-1"
                             width="16"
                             height="16"
                             aria-hidden="true">

                            <use xlink:href="#google"></use>

                        </svg>

                        Log in

                    </a>

                    

                </form>

            </div>

        </div>

    </div>

</div>
    

</body>
</html>
